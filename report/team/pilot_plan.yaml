# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Gate 2a chỉ duyệt kế hoạch pilot. Mọi con số từ cột _simulated hoặc dữ liệu chạy thử ghi nhãn simulated.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm
#   b) Theo nhân viên, m = 75: DE = 1 + 74 x 0,02 = 2,48; n = 1.251 x 2,48 = 3.103 mỗi nhóm = 42 nhân viên mỗi nhóm, tổng 84 > 40 nhân viên hiện có: không đủ người
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa = 20 / 0,02 = 1.000 < 1.251: không đạt mức chênh 5 điểm
#   d) 6 depot mỗi nhóm: tối đa 6 / 0,02 = 300 < 1.251: không đạt
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: mỗi nhân viên cần ít nhất m = 299 yêu cầu (DE = 6,96, hiệu dụng 859)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (chia theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: Có. Nhóm đối chứng làm cùng tuần, cùng depot, cùng loại yêu cầu với nhóm dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Ngẫu nhiên. Bốc thăm bằng code với seed ghi trước, phân tầng theo depot để mỗi depot có người ở cả hai nhóm.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên cùng depot chia sẻ câu trả lời của trợ lý. Giảm bằng quyền truy cập trợ lý theo tài khoản và log lượt mở trợ lý theo staff_id để phát hiện nhóm đối chứng dùng ké.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có. Chốt trong file này trước ngày bắt đầu, không đổi giữa chừng.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên mỗi nhóm (công ty có 40 nhân viên).
#
# Đánh đổi đã chấp nhận (cách chia theo nhân viên chưa đạt cỡ mẫu cho mức chênh 5 điểm):
#   Chỉ đủ mẫu để thấy mức chênh 6 điểm (859 mỗi nhóm, mỗi nhân viên từ 299 yêu cầu). Nếu tác động thật của trợ lý chỉ là 5 điểm
#   thì power với n = 859 chỉ còn khoảng 0,64 thay vì 0,8, tức khả năng bỏ sót tác động thật là khoảng 36%. Giám đốc vận hành phải ký chấp nhận điều này trước khi bắt đầu.
#   Cách chia theo depot bị loại vì chỉ có 6 cụm mỗi nhóm, dưới ngưỡng 20 cụm. Cách chia theo yêu cầu bị loại vì cùng một nhân viên vừa dùng vừa không dùng trợ lý nên tràn tác động.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn (simulated):
#   Toàn mẫu 4,25% (51/1.200); noi_dia + hang_nang 3,97% (39/982); riêng noi_dia 3,16% (26/824); riêng hang_nang 8,23% (13/158).
#   Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu vì mức hiện tại đã 3,97%. Nên đặt trần tuyệt đối 6% trên noi_dia + hang_nang
#   kèm so sánh với nhóm đối chứng (chênh 2 điểm, chỉ dùng từ bước 10 nhân viên). hang_nang đã 8,23%, cao hơn trần 6%, nên được theo dõi riêng bằng mức chênh so với đối chứng.

