    spillover_risk: "Có rủi ro nhân viên cùng depot chia sẻ câu trả lời của trợ lý. Giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id"
    predeclared: "Có. Chỉ số chính, ngưỡng, ba luật dừng và ngày quyết định chốt trong file này trước ngày bắt đầu, không đổi giữa chừng"
