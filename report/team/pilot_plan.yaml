    - "NẾU chi phí mỗi việc thành công, chưa kể chi phí cố định 40 triệu đ/tháng, vượt 8.000 đ (hiện 3.414 đ cho noi_dia + hang_nang, simulated) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được mở hang_nang. Chi phí cố định không tính vào ngưỡng này vì khi mới mở ít nhân viên nó làm chi phí mỗi việc vọt lên khoảng 15.300 đ; thay vào đó, nếu số việc thành công theo tuần dưới 50% kế hoạch thì xem lại hợp đồng chi phí cố định"
    - "NẾU tỉ lệ nhân viên sửa hoặc bỏ gợi ý vượt 40% (hiện 27,1%, 48/177 ca được xem lại, simulated) TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày và gửi PM danh sách lý do KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
